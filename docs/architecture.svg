<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f3a8a"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- Docker boundary -->
  <rect x="225" y="20" width="560" height="430" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="243" y="44" font-size="13" fill="#475569" font-weight="600">Docker Compose (local machine, one shared network)</text>

  <!-- Kestra -->
  <rect x="250" y="62" width="510" height="78" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="505" y="94" font-size="17" font-weight="700" fill="#134e4a" text-anchor="middle">Kestra Orchestrator</text>
  <text x="505" y="118" font-size="13" fill="#134e4a" text-anchor="middle">monthly schedule · backfill of past months · retries · run logs</text>

  <!-- Kestra control arrows -->
  <line x1="350" y1="140" x2="350" y2="208" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowT)"/>
  <text x="360" y="180" font-size="12" fill="#0f766e">runs ingestion</text>
  <line x1="650" y1="140" x2="650" y2="208" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowT)"/>
  <text x="660" y="180" font-size="12" fill="#0f766e">runs SQL transforms</text>

  <!-- Source -->
  <rect x="20" y="210" width="170" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="105" y="242" font-size="16" font-weight="700" fill="#78350f" text-anchor="middle">Source</text>
  <text x="105" y="266" font-size="13" fill="#78350f" text-anchor="middle">Divvy trip data</text>
  <text x="105" y="285" font-size="13" fill="#78350f" text-anchor="middle">monthly CSV (.zip)</text>
  <text x="105" y="304" font-size="13" fill="#78350f" text-anchor="middle">public S3 bucket</text>

  <!-- Python -->
  <rect x="250" y="210" width="200" height="120" rx="10" fill="#dbeafe" stroke="#1f3a8a" stroke-width="1.5"/>
  <text x="350" y="242" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Python Ingestion</text>
  <text x="350" y="266" font-size="13" fill="#1e3a8a" text-anchor="middle">download + unzip</text>
  <text x="350" y="285" font-size="13" fill="#1e3a8a" text-anchor="middle">validate + clean (pandas)</text>
  <text x="350" y="304" font-size="13" fill="#1e3a8a" text-anchor="middle">load to raw schema</text>

  <!-- PostgreSQL -->
  <rect x="540" y="210" width="220" height="120" rx="10" fill="#dbeafe" stroke="#1f3a8a" stroke-width="1.5"/>
  <text x="650" y="242" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">PostgreSQL Database</text>
  <text x="650" y="266" font-size="13" fill="#1e3a8a" text-anchor="middle">raw → staging → analytics</text>
  <text x="650" y="285" font-size="13" fill="#1e3a8a" text-anchor="middle">persistent Docker volume</text>
  <text x="650" y="304" font-size="13" fill="#1e3a8a" text-anchor="middle">port 5432</text>

  <!-- pgAdmin -->
  <rect x="560" y="375" width="180" height="58" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="650" y="400" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">pgAdmin</text>
  <text x="650" y="420" font-size="12" fill="#334155" text-anchor="middle">database admin UI · port 8080</text>
  <line x1="650" y1="375" x2="650" y2="334" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="820" y="210" width="160" height="120" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="900" y="242" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">Dashboard</text>
  <text x="900" y="266" font-size="13" fill="#4c1d95" text-anchor="middle">charts answering</text>
  <text x="900" y="285" font-size="13" fill="#4c1d95" text-anchor="middle">the 3 questions</text>
  <text x="900" y="304" font-size="13" fill="#4c1d95" text-anchor="middle">reads analytics views</text>

  <!-- Data flow arrows -->
  <line x1="190" y1="270" x2="246" y2="270" stroke="#1f3a8a" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="450" y1="270" x2="536" y2="270" stroke="#1f3a8a" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="760" y1="270" x2="816" y2="270" stroke="#1f3a8a" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="30" y1="418" x2="70" y2="418" stroke="#1f3a8a" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="80" y="422" font-size="12" fill="#334155">data flow</text>
  <line x1="30" y1="440" x2="70" y2="440" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowT)"/>
  <text x="80" y="444" font-size="12" fill="#334155">orchestration</text>
</svg>
